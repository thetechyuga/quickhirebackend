version: '3.8'

services:
  backend-api:
    build:
      context: ./quickhirebackend
    container_name: quickhire_container
    environment:
      - DATABASE_URL=sqlite:///db/db.sqlite3
    volumes:
      - ./quickhirebackend:/app
      - sqlite_data:/app/db
    ports:
      - "80:8000"
    networks:
      - app-network
    restart: always
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate &&
        gunicorn server.wsgi:application --bind 0.0.0.0:8000
      "

networks:
  app-network:
    driver: bridge

volumes:
  sqlite_data:
